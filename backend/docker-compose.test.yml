services:
  test-db:
    image: postgres:17
    container_name: groupavail-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: groupavail_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groupavail_test"]
      interval: 2s
      timeout: 5s
      retries: 10