name: GroupAvail CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: group_avail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d group_avail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      IS_TEST_DATABASE: "true"
      SUPABASE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/group_avail_test
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Apply database migrations
        shell: bash
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "$SUPABASE_DATABASE_URL" \
              --set ON_ERROR_STOP=1 \
              --file "$migration"
          done

      - name: Run backend tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://group-availability-scheduler-frontend.onrender.com/